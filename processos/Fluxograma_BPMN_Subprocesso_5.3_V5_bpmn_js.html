<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>BPMN-JS - Subprocesso 5.3 V5 (Testes A/B)</title>
  <link rel="stylesheet" href="https://unpkg.com/bpmn-js@14.0.0/dist/assets/diagram-js.css" />
  <link rel="stylesheet" href="https://unpkg.com/bpmn-js@14.0.0/dist/assets/bpmn-font/css/bpmn.css" />
  <link rel="stylesheet" href="./v5-shared.css" />
</head>

<body>
  <div class="header">
    <div style="font-size: 10px; color: #94a3b8; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 1px;">
      2ML Marketing > Gestao & Otimizacao > Nivel 5
    </div>
    <h1>Subprocesso 5.3 - Testes A/B</h1>
  </div>
  <div id="canvas"></div>

  <div class="premium-controls">
    <div class="slider-wrapper">
      <span>Inicio</span>
      <input type="range" id="scroll-slider" min="0" max="2500" value="0">
      <span>Fim</span>
    </div>
    <div class="zoom-controls">
      <button class="zoom-btn" onclick="zoomIn()" title="Aumentar Zoom">+</button>
      <button class="zoom-btn" onclick="zoomOut()" title="Diminuir Zoom">-</button>
      <button class="zoom-btn" onclick="resetZoom()" title="Resetar View">R</button>
    </div>
  </div>
  <div id="tooltip"></div>

  <script src="https://unpkg.com/bpmn-js@14.0.0/dist/bpmn-modeler.production.min.js"></script>
  <script src="./v5-shared.js"></script>
  <script src="./subprocesso-5.3-v5-data.js"></script>
  <script>
    const data = window.v5Data && window.v5Data['5.3'];
    const canvasEl = document.getElementById('canvas');
    if (typeof window.initBpmnV5 !== 'function') {
      if (canvasEl) canvasEl.innerHTML = '<div class="v5-fallback">Erro: v5-shared.js nao carregou.</div>';
    } else if (!data || !data.diagramXML) {
      if (canvasEl) canvasEl.innerHTML = '<div class="v5-fallback">Dados nao carregados (subprocesso-5.3-v5-data.js).</div>';
    } else {
      initBpmnV5(data);
    }
  </script>
</body>

</html>
